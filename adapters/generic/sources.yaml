# Official public data sources for NEXUS (curated references).
# Prefer government / intergovernmental / standards bodies.
# Fixtures stay in sources.ci.yaml for offline CI only.
#
# Citations:
# - USGS Earthquake Hazards Program — https://earthquake.usgs.gov/
# - NASA Earth Observatory Natural Event Tracker (EONET) — https://eonet.gsfc.nasa.gov/
# - arXiv API (Cornell University) — https://info.arxiv.org/help/api/
# - NIST National Vulnerability Database — https://nvd.nist.gov/
# - World Health Organization news RSS — https://www.who.int/

sources:
  - id: usgs-significant-month
    type: usgs_geojson
    enabled: true
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson
    poll_seconds: 900
    rate_limit_per_minute: 30
    metadata:
      publisher: USGS
      license: Public domain (US Government work)
      reference: https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php

  - id: nasa-eonet-open
    type: eonet
    enabled: true
    url: https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=25
    poll_seconds: 1800
    rate_limit_per_minute: 20
    metadata:
      publisher: NASA GSFC
      license: NASA data policy (public)
      reference: https://eonet.gsfc.nasa.gov/docs/v3

  - id: arxiv-cs-ai-lg
    type: atom
    enabled: true
    url: https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=20
    poll_seconds: 3600
    rate_limit_per_minute: 10
    metadata:
      publisher: arXiv (Cornell University)
      license: arXiv API Terms of Use
      reference: https://info.arxiv.org/help/api/index.html

  - id: nvd-cves-recent
    type: nvd_cve
    enabled: true
    url: https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=20
    poll_seconds: 3600
    rate_limit_per_minute: 5
    metadata:
      publisher: NIST NVD
      license: US Government work / NVD terms
      reference: https://nvd.nist.gov/developers/vulnerabilities

  - id: who-news-rss
    type: rss
    enabled: true
    url: https://www.who.int/rss-feeds/news-english.xml
    poll_seconds: 1800
    rate_limit_per_minute: 10
    metadata:
      publisher: World Health Organization
      license: WHO copyright — attribution required for reuse
      reference: https://www.who.int/
