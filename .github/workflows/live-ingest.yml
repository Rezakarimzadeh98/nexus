name: Live ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest-official:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Live official sources
        run: |
          python -m nexus_core.cli ingest --adapter generic --allow-partial
          python -m nexus_core.cli ingest --adapter cyber --allow-partial || true
          python -m nexus_core.cli ingest --adapter finance --allow-partial || true
      - name: Extract entities and events
        run: python -m nexus_core.cli extract --limit 200
      - name: Detect state and signals
        run: python -m nexus_core.cli detect --limit 2000
      - name: Discover patterns and graph
        run: python -m nexus_core.cli discover --min-count 2
      - name: Forecast baselines
        run: python -m nexus_core.cli forecast --horizon-hours 72
      - name: Evaluate scorecard
        run: python -m nexus_core.cli evaluate --horizon-hours 72 --out benchmarks/last_scorecard.json
      - name: Learn from outcomes
        run: python -m nexus_core.cli learn --horizon-hours 72 --calibration-out models/calibration.json
      - name: Export live snapshot
        run: python -m nexus_core.cli export-live --out docs/live/status.json
      - name: Build Pages site
        run: |
          mkdir -p site
          cp dashboard/index.html site/index.html
          cp docs/live/status.json site/status.json
          python -m nexus_core.cli --version
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: ingest-official
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
