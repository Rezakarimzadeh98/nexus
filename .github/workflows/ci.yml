name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Export schemas
        run: python scripts/export_schemas.py
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: DB ping
        run: python -c "from nexus_core.db import make_engine, ping_database; assert ping_database(make_engine())"
      - name: Ingest fixtures
        run: python -m nexus_core.cli ingest --sources adapters/generic/sources.yaml --fixture-root datasets
      - name: Ingest dedupe
        run: |
          python -m nexus_core.cli ingest --sources adapters/generic/sources.yaml --fixture-root datasets | tee /tmp/ingest2.txt
          grep -q "inserted=0" /tmp/ingest2.txt
