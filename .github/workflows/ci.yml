name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check src tests api
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Export schemas
        run: python scripts/export_schemas.py
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: DB ping
        run: python -c "from nexus_core.db import make_engine, ping_database; assert ping_database(make_engine())"
      - name: Ingest fixtures
        run: python -m nexus_core.cli ingest --sources adapters/generic/sources.ci.yaml --fixture-root datasets
      - name: Ingest dedupe
        run: |
          python -m nexus_core.cli ingest --sources adapters/generic/sources.ci.yaml --fixture-root datasets | tee /tmp/ingest2.txt
          grep -q "inserted=0" /tmp/ingest2.txt
      - name: Detect and export live
        run: |
          python -m nexus_core.cli detect --limit 500 --velocity-threshold 0.1 --min-short-volume 1
          python -m nexus_core.cli discover --min-count 1
          python -m nexus_core.cli forecast --horizon-hours 72
          python -m nexus_core.cli evaluate --horizon-hours 72 --out /tmp/nexus-eval.json
          python -m nexus_core.cli learn --horizon-hours 72 --calibration-out models/calibration.json
          python -m nexus_core.cli export-live --out /tmp/nexus-status.json
          test -s /tmp/nexus-status.json
          python -c "import json; d=json.load(open('/tmp/nexus-status.json')); assert 'evaluation' in d and 'learning' in d"
      - name: Scorecard regression gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ev = json.loads(Path("/tmp/nexus-eval.json").read_text())
          brier = ev.get("brier_score")
          naive = ev.get("naive_brier_score")
          # Soft gate: scorecard must be produced; if both present, model must not be wildly worse.
          assert "signal_classification" in ev
          if brier is not None and naive is not None:
              assert brier <= naive + 0.35, (brier, naive)
          cal = json.loads(Path("models/calibration.json").read_text())
          assert "calibration" in cal
          print("gate_ok", {"brier": brier, "naive": naive, "cal": cal["calibration"]})
          PY
