<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Enterprise | Real-Time FX Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Nexus Enterprise Analytics</h1>
        <p class="subtitle">داشبورد آنلاین تحلیل نرخ ارز با داده واقعی و معماری حرفه ای</p>
      </div>
      <p id="statusText" class="status">Ready</p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>پارامترهای تحلیل</h2>
        <div class="grid-4">
          <label>ارز مبدا
            <select id="baseSelect">
              <option value="USD" selected>USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
            </select>
          </label>
          <label>ارزهای مقصد
            <input id="targetsInput" type="text" value="EUR,GBP,JPY" />
          </label>
          <label>بازه روز
            <select id="daysSelect">
              <option value="7">7</option>
              <option value="30" selected>30</option>
              <option value="90">90</option>
              <option value="180">180</option>
              <option value="365">365</option>
            </select>
          </label>
          <div class="btn-row">
            <button id="loadBtn" type="button">دریافت آنلاین</button>
          </div>
        </div>
      </section>

      <section class="panel" id="kpiBox"></section>

      <section class="panel chart-wide">
        <h2>روند نرخ (Time Series)</h2>
        <canvas id="trendChart"></canvas>
      </section>

      <section class="panel chart-half">
        <h2>میانگین نرخ به تفکیک ارز</h2>
        <canvas id="avgChart"></canvas>
      </section>

      <section class="panel chart-half">
        <h2>نوسان نرخ به تفکیک ارز</h2>
        <canvas id="volatilityChart"></canvas>
      </section>

      <section class="panel add-panel">
        <h2>افزودن داده دستی</h2>
        <div class="grid-5">
          <label>تاریخ
            <input id="manualDate" type="date" />
          </label>
          <label>Base
            <input id="manualBase" type="text" value="USD" maxlength="3" />
          </label>
          <label>Target
            <input id="manualTarget" type="text" value="EUR" maxlength="3" />
          </label>
          <label>Rate
            <input id="manualRate" type="number" min="0" step="0.000001" />
          </label>
          <div class="btn-row">
            <button id="addBtn" type="button">افزودن رکورد</button>
          </div>
        </div>
      </section>

      <section class="panel table-panel">
        <h2>رکوردهای دقیق</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>تاریخ</th>
                <th>Base</th>
                <th>Target</th>
                <th>Rate</th>
                <th>Source</th>
              </tr>
            </thead>
            <tbody id="recordsTable"></tbody>
          </table>
        </div>
      </section>

      <section class="panel insights">
        <h2>خلاصه مدیریتی سریع</h2>
        <ul id="insightList"></ul>
      </section>
    </main>
  </body>
</html>
