apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: NEXUS_ENVIRONMENT
              value: {{ .Values.env.NEXUS_ENVIRONMENT | quote }}
            - name: NEXUS_LOG_LEVEL
              value: {{ .Values.env.NEXUS_LOG_LEVEL | quote }}
            - name: NEXUS_DEFAULT_TENANT_SLUG
              value: {{ .Values.env.NEXUS_DEFAULT_TENANT_SLUG | quote }}
            {{- if .Values.redis.enabled }}
            - name: NEXUS_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "nexus_core.cli", "worker"]
          env:
            - name: NEXUS_ENVIRONMENT
              value: {{ .Values.env.NEXUS_ENVIRONMENT | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
