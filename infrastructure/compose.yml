services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["cache"]

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NEXUS_DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
      NEXUS_SNAPSHOT_PATH: /app/docs/live/status.json
      NEXUS_ENVIRONMENT: local
    ports:
      - "8080:8080"
    volumes:
      - ../docs/live:/app/docs/live:ro
      - ../dashboard:/app/dashboard:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
      - ../docs/live/status.json:/usr/share/nginx/html/status.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  nexus_pg:
